name: Build APK

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources (unzip if needed)
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
            if [ -z "$ZIP" ]; then echo "ERROR: no settings.gradle and no zip found"; exit 1; fi
            echo "Unzipping $ZIP"
            unzip -q "$ZIP" -d extracted
            if [ -f extracted/settings.gradle ]; then
              cp -a extracted/. .
            else
              INNER=$(dirname "$(find extracted -maxdepth 3 -name settings.gradle | head -n1)")
              cp -a "$INNER"/. .
            fi
            rm -rf extracted
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Gradle wrapper 8.7
        run: |
          mkdir -p /tmp/wrap && cd /tmp/wrap
          gradle wrapper --gradle-version 8.7
          cp -a /tmp/wrap/gradlew "$GITHUB_WORKSPACE"/gradlew
          cp -a /tmp/wrap/gradle "$GITHUB_WORKSPACE"/gradle
          chmod +x "$GITHUB_WORKSPACE"/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-APK
          path: app/build/outputs/apk/debug/*.apk
